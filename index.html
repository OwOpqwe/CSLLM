```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSLLM</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #0f0f0f;
            color: white;
            overflow: hidden;
        }

        /* =====================================
           MAIN APP
        ===================================== */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =====================================
           SIDEBAR
        ===================================== */

        .sidebar {
            width: 260px;
            height: 100vh;
            background: #171717;
            border-right: 1px solid #303030;
            display: flex;
            flex-direction: column;
            padding: 15px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 8px;
        }

        .new-chat-button {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .new-chat-button:hover {
            background: #2d2d2d;
        }

        /* =====================================
           CHAT LIST
        ===================================== */

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 3px;
        }

        .chat-list-item {
            width: 100%;
            text-align: left;
            padding: 11px;
            margin-bottom: 5px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #ddd;
            cursor: pointer;
            font-size: 14px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .chat-list-item:hover {
            background: #252525;
        }

        .chat-list-item.active {
            background: #303030;
            color: white;
        }

        /* =====================================
           MAIN CHAT
        ===================================== */

        .main {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* =====================================
           HEADER
        ===================================== */

        .header {
            height: 60px;
            border-bottom: 1px solid #303030;
            display: flex;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* =====================================
           MESSAGES
        ===================================== */

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
            scroll-behavior: smooth;
        }

        .message {
            width: 100%;
            display: flex;
            margin-bottom: 20px;
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: min(800px, 85%);
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            overflow-wrap: break-word;
        }

        .user-message .message-content {
            background: #303030;
            color: white;
        }

        .ai-message .message-content {
            background: transparent;
            color: #f1f1f1;
        }

        /* =====================================
           CODE
        ===================================== */

        pre {
            background: #080808;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        code {
            font-family:
                Consolas,
                Monaco,
                monospace;
        }

        /* =====================================
           INPUT AREA
        ===================================== */

        .input-area {
            width: 100%;
            padding: 15px 20px 20px;
            flex-shrink: 0;
        }

        .input-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #202020;
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            padding: 8px;
        }

        #message-input {
            flex: 1;
            resize: none;
            min-height: 42px;
            max-height: 180px;
            padding: 10px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 15px;
            font-family: inherit;
        }

        #message-input::placeholder {
            color: #888;
        }

        #send-button {
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            background: white;
            color: black;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }

        #send-button:hover {
            background: #ddd;
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================
           EMPTY CHAT
        ===================================== */

        .empty-chat {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #888;
        }

        .empty-chat h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .empty-chat p {
            margin: 0;
        }

        /* =====================================
           SCROLLBAR
        ===================================== */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .sidebar {
                width: 210px;
            }

            .message-content {
                max-width: 90%;
            }

            .header {
                padding: 0 15px;
            }

            #messages {
                padding: 20px 12px;
            }

            .input-area {
                padding:
                    10px
                    10px
                    15px;
            }

        }

        @media (max-width: 500px) {

            .sidebar {
                width: 180px;
            }

            .logo {
                font-size: 20px;
            }

            .new-chat-button {
                font-size: 13px;
            }

            .chat-list-item {
                font-size: 13px;
            }

            #message-input {
                font-size: 14px;
            }

            #send-button {
                padding:
                    10px 12px;
            }

        }

    </style>
</head>

<body>

    <div class="app">

        <!-- ==================================
             SIDEBAR
        =================================== -->

        <aside class="sidebar">

            <div class="logo">
                CSLLM
            </div>

            <button
                class="new-chat-button"
                onclick="newChat()"
            >
                + New Chat
            </button>

            <div id="chat-list"></div>

        </aside>


        <!-- ==================================
             MAIN
        =================================== -->

        <main class="main">

            <header class="header">

                <div class="header-title">
                    CSLLM
                </div>

            </header>


            <!-- ==================================
                 MESSAGES
            =================================== -->

            <div id="messages">

                <div class="empty-chat">

                    <div>

                        <h1>
                            CSLLM
                        </h1>

                        <p>
                            How can I help you today?
                        </p>

                    </div>

                </div>

            </div>


            <!-- ==================================
                 INPUT
            =================================== -->

            <div class="input-area">

                <div class="input-container">

                    <textarea
                        id="message-input"
                        placeholder="Message CSLLM..."
                        rows="1"
                    ></textarea>

                    <button
                        id="send-button"
                        type="button"
                    >
                        Send
                    </button>

                </div>

            </div>

        </main>

    </div>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="chat.js"></script>

</body>
</html>
```
