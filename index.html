<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Charlie's AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">
        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="history" id="history">
            <!-- Chat history will appear here -->
        </div>

        <div class="sidebar-bottom">
            <p>Charlie's AI</p>
            <small>AI Assistant</small>
        </div>
    </aside>


    <main class="main">

        <header class="topbar">
            <h2>My AI</h2>

            <button class="menu-button" onclick="toggleSidebar()">
                ☰
            </button>
        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">
                <h1>How can I help?</h1>
                <p>Ask me anything.</p>

                <div class="suggestions">
                    <button onclick="suggest('Explain how AI works')">
                        Explain how AI works
                    </button>

                    <button onclick="suggest('Help me with my homework')">
                        Help me with my homework
                    </button>

                    <button onclick="suggest('Give me a fun project idea')">
                        Give me a project idea
                    </button>
                </div>
            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message My AI..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send-button" onclick="sendMessage()">
                    ↑
                </button>

            </div>

            <p class="disclaimer">
                My AI can make mistakes. Check important information.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
