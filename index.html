<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CSLLM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    CSLLM
                </div>

                <button
                    id="new-chat-button"
                    class="new-chat-button"
                    type="button"
                >
                    + New Chat
                </button>

            </div>


            <div class="chat-history">

                <div class="history-label">
                    Chats
                </div>

                <div
                    id="chat-list"
                    class="chat-list"
                ></div>

            </div>


            <div class="sidebar-footer">

                <button
                    type="button"
                    onclick="clearAllChats()"
                >
                    Clear chats
                </button>

            </div>

        </aside>


        <!-- MAIN AREA -->
        <main class="chat-area">

            <!-- HEADER -->
            <header class="chat-header">

                <div class="mobile-header">

                    <button
                        id="mobile-menu-button"
                        class="mobile-menu-button"
                        type="button"
                        aria-label="Open menu"
                    >
                        ☰
                    </button>

                </div>

                <h2 id="chat-title">
                    New Chat
                </h2>

                <div class="header-spacer"></div>

            </header>


            <!-- MESSAGES -->
            <section
                id="messages"
                class="messages"
                aria-live="polite"
            ></section>


            <!-- INPUT AREA -->
            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="Message CSLLM..."
                        aria-label="Message CSLLM"
                    ></textarea>

                    <button
                        id="send-button"
                        class="send-button"
                        type="button"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    CSLLM can make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
