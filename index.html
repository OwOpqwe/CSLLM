<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Charlie's AI</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<div class="app">


<aside class="sidebar">

    <div class="sidebar-header">
        <h1>Charlie's AI</h1>

        <button
            id="newChatButton"
            class="new-chat-button"
            type="button"
        >
            + New Chat
        </button>
    </div>

    <div
        id="chatList"
        class="chat-list"
    ></div>

</aside>


<main class="chat-area">

    <header class="chat-header">
        <h2 id="chatTitle">New Chat</h2>
    </header>


    <div
        id="messages"
        class="messages"
    >

        <div class="welcome">

            <h2>Welcome to Charlie's AI</h2>

            <p>
                Ask me anything, or ask me to create a graph.
            </p>

            <div class="suggestions">

                <button
                    type="button"
                    class="suggestion"
                    data-suggestion="Create a bar chart showing the population of five countries."
                >
                    Create a bar chart
                </button>

                <button
                    type="button"
                    class="suggestion"
                    data-suggestion="Create a pie chart showing global food consumption."
                >
                    Create a pie chart
                </button>

                <button
                    type="button"
                    class="suggestion"
                    data-suggestion="Create a line graph showing population growth from 2000 to 2025."
                >
                    Create a line graph
                </button>

            </div>

        </div>

    </div>


    <div class="input-container">

        <textarea
            id="messageInput"
            placeholder="Message Charlie's AI..."
            rows="1"
            aria-label="Message Charlie's AI"
        ></textarea>

        <button
            id="sendButton"
            class="send-button"
            type="button"
            aria-label="Send message"
        >
            Send
        </button>

    </div>

</main>


</div>

<script src="script.js"></script>

</body>
</html>
