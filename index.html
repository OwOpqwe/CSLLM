<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>CSLLM</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h1>CSLLM</h1>

            <button id="newChatButton" class="new-chat-button">
                + New Chat
            </button>
        </div>

        <div id="chatList" class="chat-list">
            <!-- Chats are added here by script.js -->
        </div>

    </aside>


    <!-- MAIN CHAT -->
    <main class="chat-area">

        <header class="chat-header">
            <h2 id="chatTitle">New Chat</h2>
        </header>


        <!-- MESSAGES -->
        <div id="messages" class="messages">

            <div id="welcomeMessage" class="welcome">
                <h2>Welcome to CSLLM</h2>
                <p>How can I help you?</p>
            </div>

        </div>


        <!-- INPUT -->
        <div class="input-container">

            <textarea
                id="messageInput"
                placeholder="Message CSLLM..."
                rows="1"
                aria-label="Message"
            ></textarea>

            <button
                id="sendButton"
                type="button"
                aria-label="Send message"
            >
                Send
            </button>

        </div>

    </main>

</div>


<!-- FRONTEND JAVASCRIPT -->
<script src="script.js"></script>
```

</body>
</html>
