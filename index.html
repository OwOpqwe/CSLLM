<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Charlie's AI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
```

</head>

<body>

<div class="app">

```
<aside class="sidebar">

    <div class="sidebar-header">
        <h1>Charlie's AI</h1>

        <button
            id="newChatButton"
            class="new-chat-button"
            type="button"
        >
            + New Chat
        </button>
    </div>

    <div
        id="chatList"
        class="chat-list"
    ></div>

</aside>


<main class="chat-area">

    <header class="chat-header">
        <h2 id="chatTitle">New Chat</h2>
    </header>


    <div
        id="messages"
        class="messages"
    >
        <div class="welcome">

            <h2>Welcome to Charlie's AI</h2>

            <p>
                Ask me anything, or ask me to create a graph.
            </p>

        </div>
    </div>


    <div class="controls">

        <div class="option-group">

            <label for="responseType">
                Response Type
            </label>

            <select id="responseType">

                <option value="normal">
                    Normal
                </option>

                <option value="explain">
                    Explain
                </option>

                <option value="graph">
                    Graph
                </option>

            </select>

        </div>


        <div class="option-group">

            <label for="graphType">
                Graph Type
            </label>

            <select id="graphType">

                <option value="auto">
                    Automatic
                </option>

                <option value="bar">
                    Bar
                </option>

                <option value="line">
                    Line
                </option>

                <option value="pie">
                    Pie
                </option>

                <option value="scatter">
                    Scatter
                </option>

            </select>

        </div>

    </div>


    <div class="input-container">

        <textarea
            id="messageInput"
            placeholder="Message Charlie's AI..."
            rows="1"
            aria-label="Message Charlie's AI"
        ></textarea>

        <button
            id="sendButton"
            class="send-button"
            type="button"
        >
            Send
        </button>

    </div>

</main>
```

</div>

<script src="script.js"></script>

</body>
</html>
